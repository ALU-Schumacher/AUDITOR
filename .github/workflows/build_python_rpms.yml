name: build-python-rpms

on:
  workflow_call:

jobs:
  build-apel-plugin-rpm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugins/apel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build RPM
        run: |
          rpmbuild -bb util.spec --build-in-place
 
      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          path: /home/runner/rpmbuild/RPMS/x86_64/auditor_apel_plugin*.rpm
          name: apel-plugin-rpm

  build-htcondor-collector-rpm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./collectors/htcondor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build RPM
        run: |
          rpmbuild -bb util.spec --build-in-place
 
      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          path: /home/runner/rpmbuild/RPMS/x86_64/auditor_htcondor_collector*.rpm
          name: htcondor-collector-rpm

  build-auditor-utilization-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugins/utilization_tool
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build RPM
        run: |
          rpmbuild -bb util.spec --build-in-place
 
      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          path: /home/runner/rpmbuild/RPMS/x86_64/auditor_utilization_plugin*.rpm
          name: utilization-plugin-rpm
