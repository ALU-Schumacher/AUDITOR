          rc=0
          out=$(/opt/auditor_htcondor_collector/venv/bin/auditor-htcondor-collector 2>&1) || rc=$?
          echo "$out"
          echo "exit code: $rc"

          if ! echo "$out" | grep -q "usage"; then
            echo "::error::Expected string not found in output"
            exit 1
          fi

  test-auditor-utilization-plugin-rpm:
    runs-on: ubuntu-latest
    container: ${{ inputs.container }}
    steps:
      - name: Download RPM
        uses: actions/download-artifact@v7
        with:
          name: utilization-plugin-rpm
      - name: Install RPM
        run: |
          ls -rlth
          dnf -y install auditor_utilization_plugin*.rpm
          rc=0
          out=$(/opt/auditor_utilization_plugin/venv/bin/auditor-utilization-plugin 2>&1) || rc=$?
          echo "$out"
          echo "exit code: $rc"

          if ! echo "$out" | grep -q "usage"; then
            echo "::error::Expected string not found in output"
            exit 1
          fi
