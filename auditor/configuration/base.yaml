application:
  port: 8000
database:
  host: "localhost"
  port: 5432
  username: "postgres"
  password: "password"
  database_name: "auditor"
metrics:
  database:
    enable_metrics: false
    enable_wlcg_metrics: true
    wlcg_metrics_delay: 360  #seconds delayed to gather jobs processed later in time
    benchmark_name: hepscore23
    component_name_cores: Cores
    component_name_total_cpu: CPUTime

tls_config:
  use_tls: false
  ca_cert_path: "/path/rootCA.pem"
  server_cert_path: "/path/server-cert.pem"
  server_key_path: "/path/server-key.pem"
logging:
  log_to_file: false
  log_dir: "logs"
  log_file_size: 1024
  number_of_rotated_backups: 5
